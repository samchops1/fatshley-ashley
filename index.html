<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a0204;
  font-family: "Courier New", Courier, monospace;
}

#wrap {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #2a0a10 0%, #0a0204 70%);
}

#game {
  display: block;
  max-width: 100vw;
  max-height: 100vh;
  width: auto;
  height: auto;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #1a0508;
  box-shadow: 0 0 40px rgba(255, 80, 40, 0.25);
  touch-action: none;
}

#hud {
  position: fixed;
  top: max(8px, env(safe-area-inset-top));
  right: max(8px, env(safe-area-inset-right));
  z-index: 10;
  pointer-events: none;
}

.hud-btn {
  pointer-events: auto;
  width: 44px;
  height: 44px;
  border: 2px solid #ffcc44;
  border-radius: 8px;
  background: rgba(40, 10, 15, 0.85);
  color: #ffcc44;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
}

.hud-btn:active {
  transform: scale(0.92);
  background: rgba(80, 20, 25, 0.95);
}
</style>

<script>
/* Fatshley Ashley — sheet blits + procedural fallback */
(function (global) {
  'use strict';

  const P = {
    wood: '#3d1f12',
    woodLight: '#5c3220',
    woodDark: '#241208',
    amber: '#e89a2c',
    neon: '#ffdd44',
    neonPink: '#ff4466',
    deepRed: '#8b1520',
    darkBg: '#1a0508',
    floor: '#2a1810',
    vodka: '#c8e8f0',
    ashSkin: '#e8c4a8',
    ashHair: '#1a0e08',
    ashDress: '#121212',
    barTop: '#4a2818',
    stool: '#3a2010',
  };

  // Sheet state — drop-in: replace ashley_sheet.png / patrons_sheet.png / bar_tiles.png
  let atlas = null;
  let ashleyImg = null;
  let patronsImg = null;
  let tilesImg = null;
  let tavernImg = null;
  let ready = false;
  let loadPromise = null;

  function px(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
  }

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      const img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error('Failed to load ' + src)); };
      img.src = src;
    });
  }

  function resolveAsset(base, name) {
    const map = global.__FATSHLEY_ASSETS;
    if (map && map[name]) return map[name];
    // Already a data URL / absolute URL
    if (/^(data:|blob:|https?:|\/)/.test(name)) return name;
    return (base || 'assets/') + name;
  }

  function loadSheets(base) {
    base = base || 'assets/';
    if (loadPromise) return loadPromise;
    loadPromise = (async function () {
      const map = global.__FATSHLEY_ASSETS;
      if (map && map['atlas.json']) {
        atlas = typeof map['atlas.json'] === 'string'
          ? JSON.parse(map['atlas.json'])
          : map['atlas.json'];
      } else {
        const atlasUrl = base + 'atlas.json';
        const res = await fetch(atlasUrl);
        if (!res.ok) throw new Error('atlas fetch failed');
        atlas = await res.json();
      }
      const aPath = resolveAsset(base, atlas.ashley.image || 'ashley_sheet.png');
      const pPath = resolveAsset(base, atlas.patrons.image || 'patrons_sheet.png');
      const tPath = resolveAsset(base, (atlas.tiles && atlas.tiles.image) || 'bar_tiles.png');
      const bt = atlas.bar_tavern;
      const tavernPath = bt ? resolveAsset(base, bt.image || 'bar_tavern.png') : null;
      ashleyImg = await loadImage(aPath);
      patronsImg = await loadImage(pPath);
      tilesImg = null;
      try { tilesImg = await loadImage(tPath); } catch (e) { console.warn('[Sprites] bar_tiles optional miss', e); }
      tavernImg = null;
      if (tavernPath) {
        try {
          tavernImg = await loadImage(tavernPath);
        } catch (e) {
          console.warn('[Sprites] bar_tavern load failed, using tiles fallback', e);
          tavernImg = null;
        }
      }
      ready = true;
      return true;
    })().catch(function (err) {
      ready = false;
      console.warn('[Sprites] sheet load failed, using procedural', err);
      return false;
    });
    return loadPromise;
  }

  /** Nearest-neighbor blit from a sheet frame. */
  function blit(ctx, img, frame, dx, dy, scale) {
    if (!img || !frame) return;
    scale = scale == null ? 1 : scale;
    const prev = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(
      img,
      frame.x, frame.y, frame.w, frame.h,
      Math.floor(dx), Math.floor(dy),
      Math.floor(frame.w * scale), Math.floor(frame.h * scale)
    );
    ctx.imageSmoothingEnabled = prev;
  }

  function tileFrame(id) {
    return atlas && atlas.tiles && atlas.tiles.frames ? atlas.tiles.frames[id] : null;
  }

  function blitTile(ctx, id, dx, dy, scale) {
    const fr = tileFrame(id);
    if (!fr || !tilesImg) return false;
    blit(ctx, tilesImg, fr, dx, dy, scale == null ? 1 : scale);
    return true;
  }

  function tavernFrame(id) {
    return atlas && atlas.bar_tavern && atlas.bar_tavern.frames
      ? atlas.bar_tavern.frames[id]
      : null;
  }

  function blitTavern(ctx, id, dx, dy, scale) {
    const fr = tavernFrame(id);
    if (!fr || !tavernImg) return false;
    blit(ctx, tavernImg, fr, dx, dy, scale == null ? 1 : scale);
    return true;
  }

  function hasTavern() {
    return !!(ready && tavernImg && atlas && atlas.bar_tavern && atlas.bar_tavern.frames);
  }

  // Feet pivot: bottom of 64×80 cell − 2px → draw at (x - 32*s, y - 78*s)
  function feetPivot(x, y, scale) {
    return { dx: x - 32 * scale, dy: y - 78 * scale };
  }

  function drawNeonSign(ctx, cx, y) {
    // Prefer neon letter tiles (c/a/n/d) + text fallback for full "Candlelight Tavern"
    if (ready && tilesImg && tileFrame('neon_c')) {
      const letters = ['neon_c', 'neon_a', 'neon_n', 'neon_d'];
      const scale = 1;
      const cell = 32 * scale;
      const gap = 2;
      const blockW = letters.length * (cell + gap) - gap;
      let lx = cx - blockW / 2;
      letters.forEach(function (id) {
        blitTile(ctx, id, lx, y - 20, scale);
        lx += cell + gap;
      });
      // Full venue name as neon text (tiles only cover CAND)
      ctx.save();
      ctx.font = 'bold 12px Courier New, monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = P.neon;
      ctx.shadowBlur = 10;
      ctx.fillStyle = P.neon;
      ctx.fillText('Candlelight Tavern', cx, y + 22);
      ctx.shadowBlur = 3;
      ctx.fillStyle = '#fff8c0';
      ctx.fillText('Candlelight Tavern', cx, y + 22);
      ctx.restore();
      return;
    }
    const text = 'Candlelight Tavern';
    ctx.save();
    ctx.font = 'bold 16px Courier New, monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = P.neon;
    ctx.shadowBlur = 12;
    ctx.fillStyle = P.neon;
    ctx.fillText(text, cx, y);
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#fff8c0';
    ctx.fillText(text, cx, y);
    ctx.shadowBlur = 8;
    ctx.strokeStyle = P.neonPink;
    ctx.lineWidth = 2;
    const tw = ctx.measureText(text).width;
    ctx.strokeRect(cx - tw / 2 - 10, y - 18, tw + 20, 26);
    ctx.restore();
  }

  /** Marquee strip helper: frame_l + neon_0..3 + frame_r (optional mid rail). */
  function blitMarqueeStrip(ctx, neonIds, x, y, scale) {
    scale = scale == null ? 1 : scale;
    const cell = 32 * scale;
    blitTavern(ctx, 'marquee_frame_l', x, y, scale);
    let cx = x + cell;
    neonIds.forEach(function (id, i) {
      if (i === 2) blitTavern(ctx, 'marquee_frame_m', cx - cell * 0.15, y, scale);
      blitTavern(ctx, id, cx, y, scale);
      cx += cell;
    });
    blitTavern(ctx, 'marquee_frame_r', cx, y, scale);
    return cx + cell - x;
  }

  /** Denver Candlelight Tavern pack — brick, neon marquee, center island. */
  function drawBarBackgroundTavern(ctx, W, H) {
    const floorY = Math.floor(H * 0.42);
    const bricks = ['brick_a', 'brick_b', 'brick_dark', 'brick_mortar', 'brick_soot'];

    // Brick back wall
    for (let y = 0; y < floorY; y += 32) {
      for (let x = 0; x < W; x += 32) {
        const col = Math.floor(x / 32);
        const row = Math.floor(y / 32);
        let id = bricks[(col + row * 2) % bricks.length];
        if (row === 0 && col % 5 === 0) id = 'brick_soot';
        if (col % 4 === 3) id = 'brick_mortar';
        blitTavern(ctx, id, x, y, 1);
      }
    }

    // Wall TVs + amber sconces
    blitTavern(ctx, 'tv_sports', 18, 28, 1);
    blitTavern(ctx, 'tv_fight', W - 50, 28, 1);
    blitTavern(ctx, 'amber_sconce', 56, 20, 1);
    blitTavern(ctx, 'amber_sconce', W - 88, 20, 1);
    blitTavern(ctx, 'amber_spill', 56, 48, 0.85);
    blitTavern(ctx, 'amber_spill', W - 88, 48, 0.85);
    blitTavern(ctx, 'amber_lamp', 90, 70, 0.9);
    blitTavern(ctx, 'amber_lamp', W - 122, 70, 0.9);

    // Marquee: COCKTAILS over FINE FOOD; CANDLELIGHT + TAVERN as venue name
    const cocktails = [
      'marquee_neon_cocktails_0', 'marquee_neon_cocktails_1',
      'marquee_neon_cocktails_2', 'marquee_neon_cocktails_3',
    ];
    const finefood = [
      'marquee_neon_finefood_0', 'marquee_neon_finefood_1',
      'marquee_neon_finefood_2', 'marquee_neon_finefood_3',
    ];
    const candle = [
      'neon_candlelight_0', 'neon_candlelight_1',
      'neon_candlelight_2', 'neon_candlelight_3',
    ];
    const tavern = [
      'neon_tavern_0', 'neon_tavern_1', 'neon_tavern_2', 'neon_tavern_3',
    ];
    const stripW = 32 + 4 * 32 + 32; // frame_l + 4 neon + frame_r
    const mx = Math.floor((W - stripW) / 2);
    blitMarqueeStrip(ctx, cocktails, mx, 8, 1);
    blitMarqueeStrip(ctx, finefood, mx, 40, 1);
    // Venue name — Candlelight Tavern (no fake "Candlelight Bar")
    const nameY = 72;
    const nameScale = 0.85;
    const nameCell = 32 * nameScale;
    const nameStripW = nameCell + 4 * nameCell + nameCell;
    const nx = Math.floor((W - nameStripW) / 2);
    blitMarqueeStrip(ctx, candle, nx, nameY, nameScale);
    if (tavernFrame('neon_tavern_0')) {
      blitMarqueeStrip(ctx, tavern, nx, nameY + Math.floor(nameCell) + 2, nameScale);
    }

    // Floor — prefer legacy wood tiles if present, else brick underfoot
    for (let y = floorY; y < H; y += 32) {
      for (let x = 0; x < W; x += 32) {
        if (tileFrame('floor_wood_a') && tilesImg) {
          const id = ((x + y) / 32) % 2 === 0 ? 'floor_wood_a' : 'floor_wood_b';
          blitTile(ctx, id, x, y, 1);
        } else {
          blitTavern(ctx, ((x + y) / 32) % 2 === 0 ? 'brick_a' : 'brick_dark', x, y, 1);
        }
      }
    }
    if (tileFrame('floor_plank_line') && tilesImg) {
      for (let y = floorY; y < H; y += 48) {
        for (let x = 0; x < W; x += 32) {
          blitTile(ctx, 'floor_plank_line', x, y, 1);
        }
      }
    }

    // Background activity hints (sides of room)
    blitTavern(ctx, 'pool_felt_a', 8, floorY + 8, 0.9);
    blitTavern(ctx, 'pool_felt_b', 8, floorY + 36, 0.9);
    blitTavern(ctx, 'shuffleboard_a', W - 40, floorY + 10, 0.9);
    blitTavern(ctx, 'shuffleboard_b', W - 40, floorY + 38, 0.9);

    // Center island bar — blit order from ASSETS.md
    const islandW = Math.min(260, W - 80);
    const islandX = Math.floor((W - islandW) / 2);
    const barTopY = Math.floor(H * 0.46);
    const barDepth = 56;
    const frontY = barTopY + 28;

    // (1) floor already drawn under island
    // (2) far-side top first so island reads as wrapping, then front + ends
    for (let x = islandX + 16; x < islandX + islandW - 16; x += 32) {
      blitTavern(ctx, 'center_bar_top', x, barTopY - 8, 1);
    }
    for (let x = islandX; x < islandX + islandW; x += 32) {
      blitTavern(ctx, 'center_bar_front', x, frontY, 1);
      if (barDepth > 32) blitTavern(ctx, 'center_bar_front', x, frontY + 24, 1);
    }
    blitTavern(ctx, 'center_bar_end_l', islandX - 16, barTopY + 4, 1);
    blitTavern(ctx, 'center_bar_end_r', islandX + islandW - 16, barTopY + 4, 1);

    // (3) top fill
    for (let x = islandX; x < islandX + islandW; x += 32) {
      blitTavern(ctx, 'center_bar_top', x, barTopY, 1);
    }
    // (4) near corners
    blitTavern(ctx, 'center_bar_corner_l', islandX - 8, frontY - 4, 1);
    blitTavern(ctx, 'center_bar_corner_r', islandX + islandW - 24, frontY - 4, 1);
    // (5) shine on top surface
    for (let x = islandX + 16; x < islandX + islandW - 16; x += 32) {
      blitTavern(ctx, 'center_bar_shine', x, barTopY, 1);
    }

    // Greasy burger on island
    blitTavern(ctx, 'burger_plate', islandX + Math.floor(islandW / 2) - 16, barTopY - 6, 1);

    // Optional wall shelf/bottles from legacy tiles behind island
    if (tilesImg && tileFrame('shelf')) {
      for (let x = islandX + 16; x < islandX + islandW - 16; x += 32) {
        blitTile(ctx, 'shelf', x, 108, 1);
      }
      const bottles = ['bottle_vodka', 'bottle_red', 'bottle_amber', 'bottle_green'];
      for (let i = 0; i < 6; i++) {
        const bx = islandX + 24 + i * 34;
        if (bx + 32 > islandX + islandW - 16) break;
        blitTile(ctx, bottles[i % bottles.length], bx, 84, 0.8);
      }
    }

    // (6) stools around perimeter
    const stoolY = frontY + 42;
    const stoolXs = [
      islandX - 14,
      islandX + 36,
      islandX + Math.floor(islandW / 2) - 16,
      islandX + islandW - 68,
      islandX + islandW - 18,
    ];
    stoolXs.forEach(function (sx) {
      if (sx < 4 || sx > W - 36) return;
      if (tavernFrame('center_stool')) {
        blitTavern(ctx, 'center_stool', sx, stoolY, 1);
      } else {
        blitTile(ctx, 'stool_shadow', sx, stoolY + 20, 0.9);
        blitTile(ctx, 'stool_leg', sx + 4, stoolY + 10, 0.85);
        blitTile(ctx, 'stool_seat', sx, stoolY, 0.9);
      }
    });
  }

  /** Legacy atlas.tiles center-island bar (NOT wall-hug). Floor surrounds it. */
  function drawBarBackgroundSheet(ctx, W, H) {
    const floorY = Math.floor(H * 0.42);

    // Back wall
    for (let y = 0; y < floorY; y += 32) {
      for (let x = 0; x < W; x += 32) {
        const id = (Math.floor(x / 32) % 3 === 1) ? 'wall_stripe' : 'wall_dark';
        blitTile(ctx, id, x, y, 1);
      }
    }
    // Neon pink accent strip under sign
    for (let x = 40; x < W - 40; x += 32) {
      blitTile(ctx, 'wall_neon_pink', x, 52, 1);
    }

    drawNeonSign(ctx, W / 2, 38);

    // Floor around island (checker)
    for (let y = floorY; y < H; y += 32) {
      for (let x = 0; x < W; x += 32) {
        const id = ((x + y) / 32) % 2 === 0 ? 'floor_wood_a' : 'floor_wood_b';
        blitTile(ctx, id, x, y, 1);
      }
    }
    // Plank lines
    for (let y = floorY; y < H; y += 48) {
      for (let x = 0; x < W; x += 32) {
        blitTile(ctx, 'floor_plank_line', x, y, 1);
      }
    }

    // Center island bar (wraparound counter in middle of room)
    const islandW = Math.min(260, W - 80);
    const islandX = Math.floor((W - islandW) / 2);
    const barTopY = Math.floor(H * 0.46);
    const barFrontH = 48;

    // Shelf behind island (on wall)
    for (let x = islandX; x < islandX + islandW; x += 32) {
      blitTile(ctx, 'shelf', x, 78, 1);
    }
    const bottles = ['bottle_vodka', 'bottle_red', 'bottle_amber', 'bottle_green'];
    for (let i = 0; i < 8; i++) {
      const bx = islandX + 8 + i * 30;
      if (bx + 32 > islandX + islandW) break;
      blitTile(ctx, bottles[i % bottles.length], bx, 52, 0.85);
    }

    // Bar top (island surface)
    for (let x = islandX; x < islandX + islandW; x += 32) {
      blitTile(ctx, 'bar_top', x, barTopY, 1);
    }
    // Shine overlay
    for (let x = islandX + 16; x < islandX + islandW - 16; x += 32) {
      blitTile(ctx, 'bar_shine', x, barTopY, 1);
    }
    // Bar front
    for (let row = 0; row < Math.ceil(barFrontH / 32); row++) {
      for (let x = islandX; x < islandX + islandW; x += 32) {
        blitTile(ctx, 'bar_front', x, barTopY + 28 + row * 28, 1);
      }
    }
    // Counter edges
    blitTile(ctx, 'counter_edge', islandX - 8, barTopY + 20, 1);
    blitTile(ctx, 'counter_edge', islandX + islandW - 24, barTopY + 20, 1);

    // Stools around the island (front + sides — Ashley walks in front/sides)
    const stoolY = barTopY + 70;
    const stoolXs = [
      islandX - 10,
      islandX + 40,
      islandX + islandW / 2 - 16,
      islandX + islandW - 72,
      islandX + islandW - 20,
    ];
    stoolXs.forEach(function (sx) {
      if (sx < 8 || sx > W - 40) return;
      blitTile(ctx, 'stool_shadow', sx, stoolY + 20, 0.9);
      blitTile(ctx, 'stool_leg', sx + 4, stoolY + 10, 0.85);
      blitTile(ctx, 'stool_seat', sx, stoolY, 0.9);
    });
  }

  function drawBarBackgroundProcedural(ctx, W, H) {
    const floorY = Math.floor(H * 0.42);
    // Obvious brick back wall (never a flat empty room)
    const brickColors = ['#5a2018', '#4a1810', '#6a281c', '#3a100c', '#522018'];
    const mortar = '#2a1810';
    for (let row = 0; row * 16 < floorY; row++) {
      const y = row * 16;
      const offset = (row % 2) * 16;
      for (let x = -offset; x < W; x += 32) {
        const c = brickColors[((row * 3) + Math.floor((x + offset) / 32)) % brickColors.length];
        px(ctx, x, y, 30, 14, c);
        px(ctx, x, y + 14, 32, 2, mortar);
        px(ctx, x + 30, y, 2, 14, mortar);
      }
    }
    // Dark wash so bricks read as dive-bar wall
    ctx.fillStyle = 'rgba(20,4,8,0.25)';
    ctx.fillRect(0, 0, W, floorY);

    // Floor planks
    ctx.fillStyle = P.floor;
    ctx.fillRect(0, floorY, W, H - floorY);
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    for (let y = floorY; y < H; y += 18) ctx.fillRect(0, y, W, 2);
    for (let x = 0; x < W; x += 28) ctx.fillRect(x, floorY, 2, H - floorY);

    drawNeonSign(ctx, W / 2, 38);
    // Marquee frame hint
    ctx.strokeStyle = P.neonPink;
    ctx.lineWidth = 2;
    ctx.strokeRect(W / 2 - 110, 18, 220, 36);
    ctx.strokeStyle = P.neon;
    ctx.strokeRect(W / 2 - 100, 54, 200, 22);

    // Green pool table (left) — obvious felt rectangle
    const poolX = 10, poolY = floorY + 12, poolW = 72, poolH = 96;
    px(ctx, poolX, poolY, poolW, poolH, '#1a4a28');
    px(ctx, poolX + 4, poolY + 4, poolW - 8, poolH - 8, '#2a7a40');
    px(ctx, poolX, poolY, poolW, 6, '#3a2010');
    px(ctx, poolX, poolY + poolH - 6, poolW, 6, '#3a2010');
    px(ctx, poolX, poolY, 6, poolH, '#3a2010');
    px(ctx, poolX + poolW - 6, poolY, 6, poolH, '#3a2010');
    // cue ball hint
    px(ctx, poolX + 28, poolY + 40, 6, 6, '#f0f0e8');
    px(ctx, poolX + 42, poolY + 52, 5, 5, '#cc2222');
    px(ctx, poolX + 20, poolY + 58, 5, 5, '#2266cc');

    // Shuffleboard (right)
    const shX = W - 48, shY = floorY + 14;
    px(ctx, shX, shY, 36, 110, '#c8b070');
    px(ctx, shX + 4, shY + 4, 28, 102, '#e8d090');
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    for (let i = 0; i < 5; i++) ctx.fillRect(shX + 6, shY + 16 + i * 18, 24, 2);
    px(ctx, shX + 12, shY + 88, 10, 10, '#d0d0d8');

    // Bottle shelf on back wall
    px(ctx, 40, 70, W - 80, 8, P.woodDark);
    px(ctx, 40, 78, W - 80, 4, P.wood);
    const bottles = [
      ['#c8e8f0', 60], ['#a03020', 95], ['#e8d080', 130],
      ['#60a040', 165], ['#c8e8f0', 200], ['#d06030', 235],
      ['#e8d080', 270], ['#a03020', 305],
    ];
    bottles.forEach(function (pair) {
      const c = pair[0];
      const x = pair[1];
      if (x > W - 50) return;
      px(ctx, x, 48, 10, 22, c);
      px(ctx, x + 2, 42, 6, 8, '#ddd');
      px(ctx, x + 3, 40, 4, 4, '#888');
    });

    // CENTER ISLAND bar (not wall-hug)
    const islandW = Math.min(260, W - 80);
    const islandX = (W - islandW) / 2;
    const barY = H * 0.46;
    px(ctx, islandX, barY, islandW, 28, P.barTop);
    px(ctx, islandX, barY + 28, islandW, 50, P.wood);
    px(ctx, islandX, barY + 28, islandW, 6, P.woodLight);
    ctx.fillStyle = 'rgba(255,200,100,0.08)';
    ctx.fillRect(islandX + 4, barY + 2, islandW - 8, 8);
    // greasy burger hint on island
    px(ctx, islandX + islandW / 2 - 10, barY - 4, 20, 8, '#c8a050');
    px(ctx, islandX + islandW / 2 - 8, barY - 8, 16, 6, '#60a040');

    // Stools around island front/sides
    const stoolYs = barY + 78;
    const stoolXs = [islandX - 8, islandX + 50, islandX + islandW / 2 - 14, islandX + islandW - 78, islandX + islandW - 22];
    stoolXs.forEach(function (sx) {
      if (sx < 10 || sx > W - 40) return;
      px(ctx, sx, stoolYs, 28, 8, P.stool);
      px(ctx, sx + 10, stoolYs + 8, 8, 22, P.woodDark);
      px(ctx, sx + 4, stoolYs + 28, 20, 4, P.woodDark);
    });
  }

  function drawBarBackground(ctx, W, H) {
    if (hasTavern()) {
      drawBarBackgroundTavern(ctx, W, H);
    } else if (ready && tilesImg && atlas) {
      drawBarBackgroundSheet(ctx, W, H);
    } else {
      drawBarBackgroundProcedural(ctx, W, H);
    }
  }

  function pickAshleyFrameId(frame, holdingBottle, frameId) {
    if (typeof frameId === 'string' && frameId) return frameId;
    if (holdingBottle && frame % 30 < 8) return 'drink_sip';
    return (frame % 40 < 20) ? 'idle_0' : 'idle_1';
  }

  function drawAshleySheet(ctx, x, y, scale, frame, holdingBottle, frameId) {
    const id = pickAshleyFrameId(frame, holdingBottle, frameId);
    const fr = atlas.ashley.frames[id] || atlas.ashley.frames.idle_0;
    const piv = feetPivot(x, y, scale);
    blit(ctx, ashleyImg, fr, piv.dx, piv.dy, scale);
  }

  function drawAshleyProcedural(ctx, x, y, scale, frame, holdingBottle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, 54, 34, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    const wobble = Math.sin(frame * 0.15) * 1.5;
    const armSwing = Math.sin(frame * 0.12) * 3;

    px(ctx, -18 + wobble, 28, 16, 24, '#2a1820');
    px(ctx, 2 - wobble, 28, 16, 24, '#2a1820');
    px(ctx, -20 + wobble, 48, 18, 7, '#0e0a0c');
    px(ctx, 2 - wobble, 48, 18, 7, '#0e0a0c');

    px(ctx, -30, 2, 60, 30, P.ashSkin);
    px(ctx, -32, 14, 64, 20, P.ashSkin);
    px(ctx, -28, -8, 56, 28, P.ashDress);
    px(ctx, -30, 6, 60, 14, P.ashDress);
    px(ctx, -18, -6, 8, 16, '#2a2a2a');

    px(ctx, -10, -6, 18, 5, '#1a1010');
    px(ctx, -8, -5, 2, 3, '#0a0808');
    px(ctx, -4, -5, 2, 3, '#0a0808');
    px(ctx, 0, -5, 2, 3, '#0a0808');
    px(ctx, 4, -5, 2, 3, '#0a0808');

    px(ctx, -40, 0 + armSwing, 14, 30, P.ashSkin);
    px(ctx, 26, 0 - armSwing, 14, 30, P.ashSkin);
    px(ctx, -42, 26 + armSwing, 12, 8, P.ashSkin);
    px(ctx, 30, 26 - armSwing, 12, 8, P.ashSkin);

    px(ctx, -18, -36, 36, 34, P.ashSkin);
    px(ctx, -20, -10, 40, 12, P.ashSkin);
    px(ctx, -14, -6, 28, 8, P.ashSkin);

    px(ctx, -24, -48, 48, 20, P.ashHair);
    px(ctx, -28, -40, 14, 28, P.ashHair);
    px(ctx, 14, -42, 16, 30, P.ashHair);
    px(ctx, -12, -54, 10, 12, P.ashHair);
    px(ctx, 2, -56, 12, 14, P.ashHair);
    px(ctx, -30, -28, 8, 18, P.ashHair);
    px(ctx, 22, -30, 8, 20, P.ashHair);
    px(ctx, -6, -50, 6, 8, '#2a1810');

    px(ctx, -12, -26, 8, 5, '#1a0808');
    px(ctx, 4, -26, 8, 5, '#1a0808');
    px(ctx, -10, -25, 3, 2, '#eee');
    px(ctx, 6, -25, 3, 2, '#eee');
    px(ctx, -13, -28, 10, 2, '#0a0404');

    px(ctx, -8, -14, 16, 4, '#a05060');
    px(ctx, -6, -13, 12, 2, '#e8c0c8');

    px(ctx, -16, -18, 7, 4, 'rgba(220,90,90,0.45)');
    px(ctx, 9, -18, 7, 4, 'rgba(220,90,90,0.45)');

    px(ctx, 2, -20, 3, 3, '#d4a017');
    px(ctx, 3, -19, 1, 1, '#ffe08a');

    ctx.strokeStyle = '#d4a017';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(-20, -18, 7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(20, -18, 7, 0, Math.PI * 2);
    ctx.stroke();
    px(ctx, -21, -19, 2, 2, '#ffe08a');
    px(ctx, 19, -19, 2, 2, '#ffe08a');

    if (holdingBottle) {
      px(ctx, 34, -10 - armSwing, 10, 24, P.vodka);
      px(ctx, 36, -16 - armSwing, 6, 8, '#aaa');
      px(ctx, 37, -18 - armSwing, 4, 4, '#666');
      px(ctx, 35, 2 - armSwing, 8, 4, '#e8f4f8');
    }

    ctx.restore();
  }

  function drawAshley(ctx, x, y, scale, frame, holdingBottle, frameId) {
    if (ready && ashleyImg && atlas && atlas.ashley) {
      drawAshleySheet(ctx, x, y, scale, frame, holdingBottle, frameId);
    } else {
      drawAshleyProcedural(ctx, x, y, scale, frame, holdingBottle);
    }
  }

  function drawBartender(ctx, x, y, scale, frame) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    px(ctx, -12, 10, 24, 30, '#2a3040');
    px(ctx, -10, 12, 20, 20, '#d0d0d8');
    px(ctx, -14, -18, 28, 28, '#d4a878');
    px(ctx, -16, -28, 32, 14, '#1a1010');
    px(ctx, -8, -10, 5, 4, '#222');
    px(ctx, 4, -10, 5, 4, '#222');
    px(ctx, -6, -2, 12, 3, '#884040');
    const tw = Math.sin(frame * 0.08) * 8;
    px(ctx, 10 + tw, 8, 14, 6, '#c0a060');

  function poseFromState(poseOrState) {

        if (line) lines.push(line);

    if (line) lines.push(line);

    const lineH = 14;
    const pad = 8;
    const bw = Math.min(maxW + pad * 2, Math.max.apply(null, lines.map(function (l) { return ctx.measureText(l).width; })) + pad * 2);

    ctx.beginPath();

    ctx.lineTo(x, by + bh + 10);
    ctx.lineTo(x + 6, by + bh);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#1a1008';
    ctx.textAlign = 'left';
    lines.forEach(function (l, i) {
      ctx.fillText(l, bx + pad, by + pad + (i + 1) * lineH - 2);

    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);

    ctx.fillRect(0, 0, W, H);

    Sprites.drawNeonSign(ctx, W / 2, 80);

    ctx.fillStyle = '#ff4466';
    ctx.font = 'bold 36px Courier New, monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff2244';
    ctx.shadowBlur = 16;
    ctx.fillText('FATSHLEY', W / 2, 160);
    ctx.fillText('ASHLEY', W / 2, 200);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ffcc66';
    ctx.font = '14px Courier New, monospace';
    ctx.fillText('Dive Bar Survival Comedy', W / 2, 235);

    Sprites.drawAshley(ctx, W / 2, 340, 1.6, frame, true);

    ctx.fillStyle = '#ccaa88';
    ctx.font = '12px Courier New, monospace';
    ctx.fillText('Wash Park dive. Greasy burgers. Worse decisions.', W / 2, 430);
    ctx.fillText('Vodka + rails. Yell. Crash out. Last Call.', W / 2, 448);

    if (highScore > 0) {
      ctx.fillStyle = '#ffaa44';
      ctx.fillText('HIGH SCORE: ' + highScore, W / 2, 480);
    }

    const playBtn = layoutPlayBtn(W, H);
    drawButton(ctx, playBtn, 'PLAY', { fontSize: 22, accent: '#ffee88', bg: '#5a1820' });

    ctx.fillStyle = '#886655';
    ctx.font = '10px Courier New, monospace';
    ctx.fillText('Arrows · DRINK · LINE · CRASH · IGNORE/FLIRT/YELL', W / 2, 610);
    ctx.fillText('Candlelight Tavern — open till Last Call', W / 2, 628);

    return { play: playBtn };
  }

  function drawResults(ctx, W, H, result) {
    ctx.fillStyle = 'rgba(10,2,4,0.92)';
    ctx.fillRect(0, 0, W, H);

    const win = result.reason === 'win';
    const title =
      result.reason === 'blackout' ? 'BLACKOUT' :
      result.reason === 'crash' ? 'CRASH OUT' :
      result.reason === 'sober' ? 'TOO SOBER' :
      'LAST CALL — Candlelight Tavern';

    ctx.fillStyle = win ? '#44ff88' : '#ff4466';
    ctx.font = 'bold 26px Courier New, monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 12;
    // Wrap long win title
    if (win) {
      ctx.fillText('LAST CALL', W / 2, 160);
      ctx.font = 'bold 20px Courier New, monospace';
      ctx.fillText('Still upright at the Tavern.', W / 2, 190);
    } else {
      ctx.fillText(title, W / 2, 180);
    }
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ffddaa';
    ctx.font = '16px Courier New, monospace';
    ctx.fillText('Score: ' + result.score, W / 2, 250);
    ctx.fillText('Shots: ' + result.shots, W / 2, 278);
    ctx.fillText('Patrons handled: ' + result.handled, W / 2, 306);
    ctx.fillText('Time survived: ' + Math.floor(result.survived) + 's', W / 2, 334);

    if (result.newHigh) {
      ctx.fillStyle = '#ffcc44';
      ctx.font = 'bold 18px Courier New, monospace';
      ctx.fillText('★ NEW HIGH SCORE ★', W / 2, 380);
    } else {
      ctx.fillStyle = '#aa8866';
      ctx.font = '14px Courier New, monospace';
      ctx.fillText('High score: ' + result.highScore, W / 2, 380);
    }

    // fail_blackout / fail_sober / win_lastcall / fail_crash (distinct)
    const flavor =
      result.reason === 'crash' ? 'Railed too hard. Crash-out on the sticky Tavern floor. Iconic.' :
      result.reason === 'blackout' ? 'Face-planted next to a greasy burger basket. Iconic.' :
      result.reason === 'sober' ? 'Too sober for Wash Park dive energy. She bailed.' :
      'Last Call at Candlelight Tavern. Legend status.';
    ctx.fillStyle = '#ccaa88';
    ctx.font = '12px Courier New, monospace';
    ctx.fillText(flavor, W / 2, 430);

    const retry = layoutRetryBtn(W, H);
    drawButton(ctx, retry, 'RETRY', { fontSize: 22, accent: '#ffee88', bg: '#5a1820' });

    return { retry: retry };
  }


  function drawCrashBanner(ctx, W, H, t, frame) {
    if (t <= 0) return;
    const pulse = 0.55 + Math.sin(frame * 0.45) * 0.2;
    ctx.fillStyle = 'rgba(180,10,40,' + (0.35 + pulse * 0.25) + ')';
    ctx.fillRect(0, H * 0.28, W, 54);
    ctx.strokeStyle = '#ff4466';
    ctx.lineWidth = 3;
    ctx.strokeRect(8, H * 0.28 + 4, W - 16, 46);
    ctx.fillStyle = '#ffeeaa';
    ctx.font = 'bold 22px Courier New, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff2244';
    ctx.shadowBlur = 14;
    ctx.fillText('CRASH OUT!!!', W / 2, H * 0.28 + 27);
    ctx.shadowBlur = 0;
  }

  global.UI = {
    hitRect,
    hitPad,
    drawButton,
    drawBuzzMeter,
    drawTimer,
    drawScoreHud,
    drawCrashBanner,
    layoutPlayControls,
    layoutPlayBtn,
    layoutRetryBtn,
    drawTitleScreen,
    drawResults,
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Fatshley Ashley — main game loop */
(function () {
  'use strict';

  const W = 390;
  const H = 700;
  const ROUND_TIME = 105; // seconds to Last Call
  const HS_KEY = 'fatshley_ashley_highscore';
  const SOBER_FAIL = 6; // seconds buzz<25 before fail

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const muteBtn = document.getElementById('btn-mute');

  // Audio (simple Web Audio beeps — no external files)
  let muted = localStorage.getItem('fatshley_muted') === '1';
  let audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { /* no audio */ }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function beep(freq, dur, type, vol) {
    if (muted || !audioCtx) return;
    try {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.value = vol || 0.08;
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* ignore */ }
  }

  function updateMuteUI() {
    muteBtn.textContent = muted ? '🔇' : '🔊';
  }
  updateMuteUI();
  muteBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    muted = !muted;
    localStorage.setItem('fatshley_muted', muted ? '1' : '0');
    updateMuteUI();
    ensureAudio();
    if (!muted) beep(440, 0.08);
  });

  function resize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scale = Math.min(vw / W, vh / H);
    canvas.style.width = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  function getHighScore() {
    return parseInt(localStorage.getItem(HS_KEY) || '0', 10) || 0;
  }
  function setHighScore(s) {
    localStorage.setItem(HS_KEY, String(s));
  }

  // Game state
  let state = 'title'; // title | play | results
  let frame = 0;
  let lastTs = 0;
  let ashX = W / 2;
  let ashTarget = W / 2;
  let buzz = 50;
  let soberTimer = 0; // time spent too low
  let timeLeft = ROUND_TIME;
  let shots = 0;
  let handled = 0;
  let score = 0;
  let patrons = [];
  let spawnTimer = 0;
  let nextSpawn = 3;
  let activePatron = null;
  let drinkCooldown = 0;
  let linesDone = 0;
  let linesSinceCrash = 0;
  let lineCooldown = 0;
  let crashCooldown = 0;
  let crashOutTimer = 0; // 0 = not crashing
  let ashBark = null; // optional {text, life} speech over Ashley
  let floatTexts = [];
  let pressed = {}; // aggregated: left/right/drink/… (+ _keyLeft/_keyRight)
  let resultData = null;
  let titleBtns = {};
  let resultBtns = {};
  let controls = UI.layoutPlayControls(W, H);
  let survived = 0;
  let showPatronUI = false;

  // --- Multi-touch: Map keyed by identifier (mouse = 'mouse') ---
  const pointers = new Map();
  const RELEASE_ACTIONS = { drink: 1, line: 1, crash: 1, ignore: 1, flirt: 1, yell: 1, play: 1, retry: 1 };
  const HOLD_ACTIONS = { left: 1, right: 1 };

  function resetGame() {
    ashX = W / 2;
    ashTarget = W / 2;
    buzz = 50;
    soberTimer = 0;
    timeLeft = ROUND_TIME;
    shots = 0;
    handled = 0;
    score = 0;
    patrons = [];
    spawnTimer = 0;
    nextSpawn = 2.5;
    activePatron = null;
    drinkCooldown = 0;
    lineCooldown = 0;
    crashCooldown = 0;
    crashOutTimer = 0;
    ashBark = null;
    floatTexts = [];
    pressed = {};
    pointers.clear();
    survived = 0;
    showPatronUI = false;
    resultData = null;
    Patrons.shuffleLines();
  }

  function addFloat(text, x, y, color, life) {
    floatTexts.push({ text: text, x: x, y: y, color: color || '#ffcc44', life: life == null ? 1.2 : life });
  }

  function clientToCanvas(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((clientX - rect.left) / rect.width) * W,
      y: ((clientY - rect.top) / rect.height) * H,
    };
  }

  /** Derive pressed.left/right from ANY active pointer over those buttons (+ keyboard). */
  function rebuildPressed() {
    const keyLeft = !!pressed._keyLeft;
    const keyRight = !!pressed._keyRight;
    const next = {};
    pointers.forEach(function (p) {
      if (!p || !p.action) return;
      if (HOLD_ACTIONS[p.action] && p.downInRect) next[p.action] = true;
      if (RELEASE_ACTIONS[p.action] && p.downInRect) next[p.action] = true;
    });
    if (keyLeft) next.left = true;
    if (keyRight) next.right = true;
    next._keyLeft = keyLeft;
    next._keyRight = keyRight;
    pressed = next;
  }


  function hitActionAt(x, y) {
    if (state === 'title') {
      const playBtn = UI.layoutPlayBtn(W, H);
      if (UI.hitPad(x, y, playBtn)) return { action: 'play', rect: playBtn };
      return null;
    }
    if (state === 'results') {
      const retry = UI.layoutRetryBtn(W, H);
      if (UI.hitPad(x, y, retry)) return { action: 'retry', rect: retry };
      return null;
    }
    if (state === 'play') {
      controls = UI.layoutPlayControls(W, H);
      if (UI.hitPad(x, y, controls.left)) return { action: 'left', rect: controls.left };
      if (UI.hitPad(x, y, controls.right)) return { action: 'right', rect: controls.right };
      if (UI.hitPad(x, y, controls.drink)) return { action: 'drink', rect: controls.drink };
      if (UI.hitPad(x, y, controls.line)) return { action: 'line', rect: controls.line };
      if (UI.hitPad(x, y, controls.crash)) return { action: 'crash', rect: controls.crash };
      if (showPatronUI && activePatron && activePatron.state === 'talking' && crashOutTimer <= 0) {
        if (UI.hitPad(x, y, controls.ignore)) return { action: 'ignore', rect: controls.ignore };
        if (UI.hitPad(x, y, controls.flirt)) return { action: 'flirt', rect: controls.flirt };
        if (UI.hitPad(x, y, controls.yell)) return { action: 'yell', rect: controls.yell };
      }
      // Floor drag zone (above controls)
      if (y < H - 160) return { action: 'floor', rect: null };
    }
    return null;
  }

  function fireAction(action) {
    if (action === 'play') {
      resetGame();
      state = 'play';
      beep(660, 0.12);
      beep(880, 0.15);
      return;
    }
    if (action === 'retry') {
      resetGame();
      state = 'play';
      beep(660, 0.1);
      return;
    }
    if (action === 'drink') { doDrink(); return; }
    if (action === 'line') { doLine(); return; }
    if (action === 'crash') { doCrashOut(true); return; }
    if (action === 'ignore') { doIgnore(); return; }
    if (action === 'flirt') { doFlirt(); return; }
    if (action === 'yell') { doYell(); return; }
  }

  function onPointerDown(id, clientX, clientY) {
    ensureAudio();
    const p = clientToCanvas(clientX, clientY);
    const hit = hitActionAt(p.x, p.y);
    const action = hit ? hit.action : null;
    const rect = hit ? hit.rect : null;

    pointers.set(id, {
      action: action,
      x: p.x,
      y: p.y,
      rect: rect,
      downInRect: !!action && action !== 'floor',
    });

    // Floor drag only for the finger that started the drag
    if (action === 'floor') {
      ashTarget = Math.max(50, Math.min(W - 50, p.x));
    }
    if (action === 'play' || action === 'retry') {
      beep(523, 0.1);
    }
    rebuildPressed();
  }

  function onPointerMove(id, clientX, clientY) {
    const entry = pointers.get(id);
    if (!entry) return;
    const p = clientToCanvas(clientX, clientY);
    entry.x = p.x;
    entry.y = p.y;

    // Floor drag: only the finger that started it
    if (entry.action === 'floor' && state === 'play') {
      ashTarget = Math.max(50, Math.min(W - 50, p.x));
      return;
    }

    // Hold left/right: slide onto/off
    if (state === 'play') {
      controls = UI.layoutPlayControls(W, H);
      if (UI.hitPad(p.x, p.y, controls.left)) {
        entry.action = 'left';
        entry.rect = controls.left;
        entry.downInRect = true;
      } else if (UI.hitPad(p.x, p.y, controls.right)) {
        entry.action = 'right';
        entry.rect = controls.right;
        entry.downInRect = true;
      } else if (HOLD_ACTIONS[entry.action]) {
        entry.downInRect = false;
      }
    }

    // Release-actions: cancel highlight if finger left padded rect
    if (entry.action && RELEASE_ACTIONS[entry.action] && entry.rect) {
      entry.downInRect = UI.hitPad(p.x, p.y, entry.rect);
    }

    rebuildPressed();
  }

  function onPointerUp(id, clientX, clientY) {
    const entry = pointers.get(id);
    if (!entry) return;
    const p = clientToCanvas(clientX, clientY);

    // DRINK/LINE/CRASH/IGNORE/FLIRT/YELL/PLAY/RETRY: fire on pointerup if still inside padded hit rect
    if (entry.action && RELEASE_ACTIONS[entry.action] && entry.rect) {
      if (UI.hitPad(p.x, p.y, entry.rect)) {
        fireAction(entry.action);
      }
    }

    // Clear ONLY this finger's state (never wipe all pointers)
    pointers.delete(id);
    rebuildPressed();
  }

  function clearPointer(id) {
    if (pointers.has(id)) {
      pointers.delete(id);
      rebuildPressed();
    }
  }

  // Touch events — per changedTouches[i].identifier (NOT touches[0])
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      onPointerDown(t.identifier, t.clientX, t.clientY);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      onPointerMove(t.identifier, t.clientX, t.clientY);
    }
  }, { passive: false });

  canvas.addEventListener('touchend', function (e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      onPointerUp(t.identifier, t.clientX, t.clientY);
    }
  }, { passive: false });

  canvas.addEventListener('touchcancel', function (e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      clearPointer(e.changedTouches[i].identifier);
    }
  }, { passive: false });

  // Mouse = single pointer id 'mouse'
  canvas.addEventListener('mousedown', function (e) {
    e.preventDefault();
    onPointerDown('mouse', e.clientX, e.clientY);
  });
  canvas.addEventListener('mousemove', function (e) {
    if (!pointers.has('mouse')) return;
    e.preventDefault();
    onPointerMove('mouse', e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseup', function (e) {
    e.preventDefault();
    onPointerUp('mouse', e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseleave', function () {
    clearPointer('mouse');
  });

  // Keyboard still works if present
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      pressed._keyLeft = true;
      rebuildPressed();
    }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      pressed._keyRight = true;
      rebuildPressed();
    }
    if ((e.key === ' ' || e.key === 'Enter') && state === 'play') {
      e.preventDefault();
      doDrink();
    }
    if ((e.key === 'l' || e.key === 'L') && state === 'play') {
      e.preventDefault();
      doLine();
    }
    if ((e.key === 'c' || e.key === 'C') && state === 'play') {
      e.preventDefault();
      doCrashOut();
    }
    if ((e.key === 'Enter' || e.key === ' ') && state === 'title') {
      e.preventDefault();
      fireAction('play');
    }
    if ((e.key === 'Enter' || e.key === ' ') && state === 'results') {
      e.preventDefault();
      fireAction('retry');
    }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      pressed._keyLeft = false;
      rebuildPressed();
    }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      pressed._keyRight = false;
      rebuildPressed();
    }
  });

  function doDrink() {
    if (state !== 'play' || crashOutTimer > 0) return;
    if (drinkCooldown > 0) return;
    drinkCooldown = 0.45;
    shots++;
    const gain = 10 + Math.random() * 8;
    buzz = Math.min(100, buzz + gain);
    score += 5;
    addFloat('+' + Math.floor(gain) + ' BUZZ', ashX, H * 0.55, '#88ccff');
    beep(220, 0.06, 'sawtooth', 0.06);
    beep(330, 0.1, 'square', 0.05);
    if (buzz >= 100) endGame('blackout');
  }

  function doLine() {
    if (state !== 'play' || crashOutTimer > 0 || lineCooldown > 0) return;
    lineCooldown = 1.6;
    score += 18;
    const gain = 22 + Math.random() * 14; // big rail buzz/chaos spike
    buzz = Math.min(100, buzz + gain);
    addFloat('LINE!', ashX, H * 0.50, '#ffe066', 1.4);
    addFloat('RAIL', ashX, H * 0.46, '#ff88ff', 1.0);
    addFloat(Patrons.ashleyRail(), ashX, H * 0.56, '#ffccff', 1.6);
    ashBark = { text: Patrons.ashleyRail(), life: 1.6 };
    beep(880, 0.08, 'square', 0.07);
    beep(220, 0.12, 'sawtooth', 0.09);
    beep(1100, 0.1, 'triangle', 0.05);
    // Auto mid-round crash-out after enough rails / high chaos
    linesDone = (typeof linesDone === 'number' ? linesDone : 0) + 1;
    linesSinceCrash = (typeof linesSinceCrash === 'number' ? linesSinceCrash : 0) + 1;
    if (linesSinceCrash >= 3 || (buzz >= 78 && Math.random() < 0.35)) {
      doCrashOut();
    } else if (buzz >= 100) {
      endGame('blackout');
    }
  }

  function doCrashOut(endRound) {
    if (state !== 'play' || crashOutTimer > 0 || crashCooldown > 0) return;
    crashOutTimer = 2.2;
    crashCooldown = 2.0;
    linesSinceCrash = 0;
    // Clear active / nearby patrons — flee
    if (activePatron) {
      activePatron.state = 'leaving';
      activePatron.leaveDir = activePatron.x < ashX ? -1 : 1;
      activePatron.speed *= 2.2;
      activePatron = null;
    }
    let cleared = 0;
    patrons.forEach(function (p) {
      if (p.state === 'talking' || p.state === 'approaching') {
        p.state = 'leaving';
        p.leaveDir = p.x < ashX ? -1 : 1;
        p.speed *= 2.0;
        cleared++;
      }
    });
    showPatronUI = false;
    handled += Math.max(1, cleared);
    score += 40 + cleared * 12;
    let gain = 15 + Math.random() * 13; // +15..28
    if (buzz > 85) gain = Math.max(gain, (100 - buzz) + 1 + Math.random() * 8);
    buzz = Math.min(100, buzz + gain);
    addFloat('CRASHING OUT', ashX, H * 0.52, '#ff4466', 1.8);
    ashBark = { text: Patrons.ashleyCrash(), life: 2.2 };
    beep(90, 0.25, 'sawtooth', 0.12);
    beep(160, 0.2, 'square', 0.08);
    // CRASH button ends the round; auto mid-round crash keeps playing unless blackout
    if (endRound) {
      endGame('crash');
      return;
    }
    if (buzz >= 100) endGame('blackout');
  }

  function doIgnore() {
    if (crashOutTimer > 0) return;
    if (!activePatron || activePatron.state !== 'talking') return;
    activePatron.state = 'leaving';
    activePatron.leaveDir = Math.random() < 0.5 ? -1 : 1;
    handled++;
    score += 8;
    addFloat(Patrons.ashleyIgnore(), activePatron.x, activePatron.y - 40, '#aaaaaa');
    beep(300, 0.08);
    activePatron = null;
    showPatronUI = false;
  }

  function doFlirt() {
    if (crashOutTimer > 0) return;
    if (!activePatron || activePatron.state !== 'talking') return;
    const swing = (Math.random() < 0.5 ? -1 : 1) * (12 + Math.random() * 18);
    buzz = Math.max(0, Math.min(100, buzz + swing));
    handled++;
    score += 15;
    const msg = Patrons.ashleyFlirt(swing > 0);
    addFloat(msg, activePatron.x, activePatron.y - 40, swing > 0 ? '#ff88aa' : '#ffaa44');
    activePatron.state = 'leaving';
    activePatron.leaveDir = swing > 0 ? 1 : -1;
    beep(swing > 0 ? 520 : 180, 0.12, 'triangle');
    activePatron = null;
    showPatronUI = false;
    if (buzz >= 100) endGame('blackout');
    if (buzz <= 0) soberTimer = Math.max(soberTimer, 2);
  }

  function doYell() {
    if (crashOutTimer > 0) return;
    if (!activePatron || activePatron.state !== 'talking') return;
    buzz = Math.max(0, buzz - 8);
    handled++;
    score += 10;
    addFloat(Patrons.ashleyYell(), activePatron.x, activePatron.y - 40, '#ff6644');
    activePatron.state = 'leaving';
    activePatron.leaveDir = activePatron.x < ashX ? -1 : 1;
    activePatron.speed *= 1.8;
    beep(150, 0.15, 'sawtooth', 0.1);
    activePatron = null;
    showPatronUI = false;
  }

  function endGame(reason) {
    if (state !== 'play') return;
    survived = ROUND_TIME - timeLeft;
    score += Math.floor(survived) * 2;
    score += shots * 5;
    score += handled * 10;
    if (reason === 'win') score += 100;
    if (reason === 'crash') score += 25;

    const high = getHighScore();
    const newHigh = score > high;
    if (newHigh) setHighScore(score);

    resultData = {
      reason: reason,
      score: score,
      shots: shots,
      handled: handled,
      survived: survived,
      highScore: Math.max(high, score),
      newHigh: newHigh,
    };
    state = 'results';
    pointers.clear();
    pressed = {};
    crashOutTimer = 0;
    if (reason === 'blackout' || reason === 'crash') {
      addFloat(Patrons.ashleyCrash(), ashX, H * 0.5, '#ff6688', 2.5);
      beep(120, 0.3, 'sawtooth', 0.1);
    } else if (reason === 'win') {
      beep(523, 0.1); beep(659, 0.1); beep(784, 0.2);
    } else {
      beep(120, 0.3, 'sawtooth', 0.1);
    }
  }

  function update(dt) {
    frame++;
    if (state !== 'play') return;

    timeLeft -= dt;
    survived = ROUND_TIME - timeLeft;
    if (timeLeft <= 0) {
      timeLeft = 0;
      endGame('win');
      return;
    }

    const crashing = crashOutTimer > 0;
    const moveSpeed = crashing ? 55 : 160;
    if (pressed.left) ashTarget = Math.max(50, ashX - moveSpeed * dt * 3);
    if (pressed.right) ashTarget = Math.min(W - 50, ashX + moveSpeed * dt * 3);
    ashX += (ashTarget - ashX) * Math.min(1, (crashing ? 3 : 8) * dt);

    buzz = Math.max(0, buzz - 3.2 * dt);
    drinkCooldown = Math.max(0, drinkCooldown - dt);
    lineCooldown = Math.max(0, lineCooldown - dt);
    if (!crashing) crashCooldown = Math.max(0, crashCooldown - dt);

    // Crash-out tick — set crashCooldown when timer hits 0
    if (crashing) {
      crashOutTimer = Math.max(0, crashOutTimer - dt);
      if (crashOutTimer <= 0) {
        crashCooldown = 8;
        if (buzz >= 100) {
          endGame('crash');
          return;
        }
      }
    }

    // TOO SOBER: buzz < 25 for >6s continuous (paused during crash-out)
    if (!crashing) {
      if (buzz < 25) {
        soberTimer += dt;
        if (soberTimer > SOBER_FAIL) {
          endGame('sober');
          return;
        }
      } else {
        soberTimer = Math.max(0, soberTimer - dt * 0.5);
      }
    }

    // Blackout only outside active crash-out (crash expiry handles crash fail)
    if (!crashing && buzz >= 100) {
      endGame('blackout');
      return;
    }

    spawnTimer += dt;
    const talking = patrons.filter(function (p) {
      return p.state === 'talking' || p.state === 'approaching';
    });
    if (!crashing && spawnTimer >= nextSpawn && talking.length < 2) {
      spawnTimer = 0;
      nextSpawn = 4 + Math.random() * 4 - Math.min(2, (ROUND_TIME - timeLeft) / 40);
      const np = Patrons.createPatron(W, H, Math.random() < 0.5);
      patrons.push(np);
      beep(400, 0.05, 'sine', 0.04);
    }

    patrons.forEach(function (p) { Patrons.updatePatron(p, dt, W); });
    patrons = patrons.filter(function (p) { return p.state !== 'gone'; });

    if (!crashing) {
      const talkers = patrons.filter(function (p) { return p.state === 'talking'; });
      if (talkers.length) {
        talkers.sort(function (a, b) { return Math.abs(a.x - ashX) - Math.abs(b.x - ashX); });
        activePatron = talkers[0];
        showPatronUI = true;
      } else {
        if (activePatron && activePatron.state !== 'talking') {
          activePatron = null;
        }
        showPatronUI = !!activePatron && activePatron.state === 'talking';
      }
    } else {
      showPatronUI = false;
    }

    floatTexts.forEach(function (f) {
      f.life -= dt;
      f.y -= 30 * dt;
    });
    floatTexts = floatTexts.filter(function (f) { return f.life > 0; });

    if (ashBark) {
      ashBark.life -= dt;
      if (ashBark.life <= 0) ashBark = null;
    }
  }

  function ashleyFrameId() {
    if (state === 'results' && resultData) {
      if (resultData.reason === 'blackout' || resultData.reason === 'crash') return 'fail_blackout';
      if (resultData.reason === 'win') return 'win_smug';
      if (resultData.reason === 'sober') return 'reject';
    }
    if (crashOutTimer > 0) return (frame % 16 < 8) ? 'pass_out' : 'reject';
    if (ashBark && ashBark.life > 0.3) return 'talk';
    if (drinkCooldown > 0.2) return 'drink_raise';
    if (drinkCooldown > 0) return 'drink_sip';
    if (lineCooldown > 0.35) return 'buzz_high';
    if (buzz > 80) return 'buzz_high';
    if (buzz > 55) return 'buzz_mid';
    if (buzz < 25) return 'buzz_low';
    return (frame % 40 < 20) ? 'idle_0' : 'idle_1';
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    if (state === 'title') {
      // Shared layout helper — never call drawTitleScreen from tap handlers
      titleBtns = UI.drawTitleScreen(ctx, W, H, getHighScore(), frame);
      if (pressed.play) {
        UI.drawButton(ctx, titleBtns.play, 'PLAY', { pressed: true, fontSize: 22, accent: '#ffee88', bg: '#5a1820' });
      }
      return;
    }

    Sprites.drawBarBackground(ctx, W, H);
    // Bartender behind center island
    Sprites.drawBartender(ctx, W / 2, H * 0.44, 1.0, frame);

    const sorted = patrons.slice().sort(function (a, b) { return a.y - b.y; });
    sorted.forEach(function (p) {
      const pose = p.state === 'approaching' || p.state === 'leaving' ? 'walk' :
                   (p.state === 'talking' ? 'talk' : 'idle');
      Sprites.drawPatron(ctx, p.x, p.y, 1.15, p.variant, frame + p.age * 10, p.facing, pose);
      if (p.state === 'talking' && p === activePatron && crashOutTimer <= 0) {
        Sprites.drawSpeechBubble(ctx, p.x, p.y - 50, p.line, 160);
      }
    });

    // Ashley walks in front / sides of island
    Sprites.drawAshley(ctx, ashX, H * 0.58, 1.35, frame, true, ashleyFrameId());

    if (ashBark && ashBark.text) {
      Sprites.drawSpeechBubble(ctx, ashX, H * 0.48, ashBark.text, 170);
    }

    // HUD — pass soberTimer for fuse UI
    UI.drawBuzzMeter(ctx, 20, 100, W - 40, 18, buzz, soberTimer);
    UI.drawTimer(ctx, W / 2, 55, timeLeft, ROUND_TIME);
    const liveScore = score + Math.floor(survived) * 2;
    UI.drawScoreHud(ctx, 16, 148, liveScore, shots, handled);

    if (crashOutTimer > 0 && UI.drawCrashBanner) {
      UI.drawCrashBanner(ctx, W, H, crashOutTimer, frame);
    }

    if (buzz < 25 && crashOutTimer <= 0) {
      ctx.fillStyle = 'rgba(80,120,255,' + (0.08 + Math.sin(frame * 0.2) * 0.05) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#88aaff';
      ctx.font = 'bold 14px Courier New, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('TOO SOBER! DRINK!', W / 2, 185);
    }
    if (buzz > 80) {
      ctx.fillStyle = 'rgba(200,20,40,' + (0.08 + Math.sin(frame * 0.25) * 0.06) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff6688';
      ctx.font = 'bold 14px Courier New, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(buzz >= 95 ? 'BLACKOUT TIP!' : 'BLACKOUT ZONE!', W / 2, 185);
    }

    controls = UI.layoutPlayControls(W, H);
    UI.drawButton(ctx, controls.left, '◀', { pressed: pressed.left, fontSize: 24 });
    UI.drawButton(ctx, controls.right, '▶', { pressed: pressed.right, fontSize: 24 });

    const lineDisabled = lineCooldown > 0 || crashOutTimer > 0;
    const crashDisabled = crashCooldown > 0 || crashOutTimer > 0;
    const drinkDisabled = drinkCooldown > 0 || crashOutTimer > 0;

    // Bright labels: ◀ ▶ | CRASH | LINE | DRINK — thumb-obvious on phone
    UI.drawButton(ctx, controls.crash, 'CRASH', {
      pressed: pressed.crash,
      fontSize: 15,
      accent: crashDisabled ? '#886666' : '#ffee66',
      bg: crashDisabled ? '#2a2020' : '#8a1028',
      danger: !crashDisabled,
    });
    UI.drawButton(ctx, controls.line, 'LINE', {
      pressed: pressed.line,
      fontSize: 16,
      accent: lineDisabled ? '#776688' : '#ffffff',
      bg: lineDisabled ? '#2a2030' : '#7a20a8',
    });
    UI.drawButton(ctx, controls.drink, 'DRINK', {
      pressed: pressed.drink,
      fontSize: 16,
      accent: drinkDisabled ? '#667788' : '#88ddff',
      bg: drinkDisabled ? '#2a2030' : '#203050',
    });

    if (showPatronUI && activePatron && crashOutTimer <= 0) {
      UI.drawButton(ctx, controls.ignore, 'IGNORE', { pressed: pressed.ignore, fontSize: 13, accent: '#ccccaa' });
      UI.drawButton(ctx, controls.flirt, 'FLIRT', { pressed: pressed.flirt, fontSize: 13, accent: '#ff88aa', bg: '#4a1828' });
      UI.drawButton(ctx, controls.yell, 'YELL', { pressed: pressed.yell, fontSize: 13, accent: '#ff6644', danger: true });
    }

    floatTexts.forEach(function (f) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
      ctx.fillStyle = f.color;
      ctx.font = 'bold 14px Courier New, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    });

    if (state === 'results' && resultData) {
      resultBtns = UI.drawResults(ctx, W, H, resultData);
    }
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // Kick sheet load (non-blocking; procedural fallback until ready)
  if (Sprites.loadSheets) {
    Sprites.loadSheets('assets/').catch(function () { /* fallback stays */ });
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
